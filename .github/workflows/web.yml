name: Web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml', '.nvmrc']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml', '.nvmrc']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Lint, type-check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint:oxlint -- --deny-warnings
      - run: npm run lint:eslint -- --max-warnings=0
      - run: npm run format:check
      - run: npm run type-check
      - run: npm test
      # Type-checking already ran above; this only bundles.
      - run: npm run build-only
